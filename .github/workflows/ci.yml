name: ECLAT correctness and benchmark smoke
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        julia-version: ['1.9', '1.11']
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: ${{ matrix.julia-version }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: julia --project=. -e 'using Pkg; Pkg.instantiate()'
      - run: python3 scripts/prepare_spmf.py
      - run: julia --project=. tests/runtests.jl
      - run: julia --project=. scripts/mine.jl --help
      - run: python3 tests/smoke_benchmark.py
  controller:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements-plot.txt
      - run: python tests/test_benchmark.py -v
      - run: python tests/test_plot_results.py -v
