name: ECLAT and applications correctness
on: [push, pull_request]
jobs:
  test:
    # Julia 1.9 needs the pre-glibc-2.41 executable-stack policy; pin the LTS image.
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        julia-version: ['1.9', '1.11']
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: ${{ matrix.julia-version }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: julia --project=. -e 'using Pkg; Pkg.instantiate()'
      - run: python3 scripts/prepare_spmf.py
      - run: python tests/test_application_sources.py
      - run: julia --project=. tests/runtests.jl
      - run: julia --project=. scripts/mine.jl --help
      - run: python3 tests/smoke_benchmark.py
  controller:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements-plot.txt
      - run: python tests/test_benchmark.py -v
      - run: python tests/test_plot_results.py -v

  applications-notebook:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1.11'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: python -B scripts/run_notebook.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: m2-applications-notebook
          path: .tools/notebook-runs/
