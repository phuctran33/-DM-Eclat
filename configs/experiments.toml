# Proposed pilot grid, NOT measured or claimed optimal. Tune before final runs.
# 6 points / dataset, descending relative support. Do not truncate output length.
seed = 42
warmup_runs = 1
repeats = 5
backends = ["list", "bitset", "spmf"]
scalability_dataset = "retail"
scalability_fractions = [0.10, 0.25, 0.50, 0.75, 1.00]
synthetic_lengths = [5, 10, 15, 20, 25, 30]
synthetic_transactions = 10000
synthetic_items = 100
synthetic_minsup = 0.20

[[datasets]]
name = "chess"
path = "data/benchmark/chess.txt"
minsup = [0.95, 0.90, 0.85, 0.80, 0.75, 0.70]
memory_minsup = 0.85

[[datasets]]
name = "mushroom"
path = "data/benchmark/mushroom.txt"
minsup = [0.60, 0.55, 0.50, 0.45, 0.40, 0.35]
memory_minsup = 0.50

[[datasets]]
name = "retail"
path = "data/benchmark/retail.txt"
minsup = [0.05, 0.04, 0.03, 0.02, 0.01, 0.005]
memory_minsup = 0.03

[[datasets]]
name = "T10I4D100K"
path = "data/benchmark/T10I4D100K.txt"
minsup = [0.020, 0.015, 0.010, 0.008, 0.006, 0.004]
memory_minsup = 0.010
